# ==========================================================================
#  /etc/nginx/sites-available/formsfitness.com
#
#  Instalar:
#    sudo cp nginx/formsfitness.com.conf /etc/nginx/sites-available/formsfitness.com
#    sudo ln -s /etc/nginx/sites-available/formsfitness.com /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
#  Depois rode o certbot, que reescreve este arquivo acrescentando o bloco 443
#  e o redirecionamento:
#    sudo certbot --nginx -d formsfitness.com -d www.formsfitness.com
#  Não edite à mão as linhas que o certbot inserir.
# ==========================================================================

server {
    listen 80;
    listen [::]:80;
    server_name formsfitness.com www.formsfitness.com;

    # O painel envia foto em base64 dentro do JSON. O padrão do nginx é 1 MB —
    # sem isto, enviar uma foto de celular devolve 413 e o upload falha sem
    # explicação. 25 MB é o mesmo teto que o server.js aplica no readBody.
    client_max_body_size 25m;

    access_log /var/log/nginx/formsfitness.access.log;
    error_log  /var/log/nginx/formsfitness.error.log;

    # Metadados de repositório nunca devem sair pela web. O server.js já
    # bloqueia, mas aqui a porta fecha antes de chegar na aplicação.
    location ~ /\.(git|env|gitignore) {
        deny all;
        return 404;
    }

    # ------------------------------------------------------------------
    #  Página de manutenção quando a APLICAÇÃO está fora do ar.
    #  O modo manutenção do painel cobre o caso do app RODANDO; isto cobre
    #  restart, deploy e queda — quando não há app para responder. Sem isto o
    #  visitante veria a tela cinza de "502 Bad Gateway" do nginx.
    # ------------------------------------------------------------------
    error_page 502 503 504 /manutencao.html;
    location = /manutencao.html {
        root /var/www/projetos/Forms-Fitness;
        internal;
        add_header Retry-After 3600 always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:5186;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Sem estes dois a aplicação enxerga todo mundo como 127.0.0.1: o
        # contador de acessos veria um visitante só, o freio de senha somaria
        # o mundo inteiro no mesmo balde, e o cookie de sessão do painel não
        # receberia a marca Secure.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}
