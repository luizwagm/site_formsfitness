# ==========================================================================
#  Entrega automática — Forms Fitness
#
#  Dois trabalhos em sequência: PROVAR e ENTREGAR. O segundo só existe se o
#  primeiro passar (`needs`), então suíte vermelha não vira site no ar.
#
#  Este projeto NÃO usa PostgreSQL — o conteúdo todo vive no SQLite do próprio
#  site. Por isso o portão aqui não levanta banco nenhum: sobe o servidor de
#  verdade e roda a suíte contra ele, que é o que a suíte espera.
#
#  A CHAVE DESTE WORKFLOW NÃO DÁ SHELL. No servidor ela está presa a um
#  `command=` que roda só a entrega deste site, com `restrict`. Provado com a
#  chave ainda apontando para um `echo`, antes de ligar no deploy.
# ==========================================================================
name: Provar e entregar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: entrega-forms
  cancel-in-progress: false

jobs:
  provar:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      # A mesma linha do servidor. Provar em outra versão é provar outro
      # programa — e o `node:sqlite`, que este projeto usa, mudou de
      # comportamento entre versões.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      # ------------------------------------------------------------------
      #  Conferências estáticas — baratas, e pegam o que mais quebrou aqui
      # ------------------------------------------------------------------
      - name: Todo JavaScript compila
        run: |
          erros=0
          while IFS= read -r f; do
            node --check "$f" || { echo "ERRO de sintaxe: $f"; erros=1; }
          done < <(git ls-files '*.js' '*.cjs')
          exit $erros

      - name: Todo shell script compila
        run: |
          erros=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "ERRO de sintaxe: $f"; erros=1; }
          done < <(git ls-files '*.sh')
          exit $erros

      # Um `\r` no fim da linha faz o bash procurar o interpretador "bash\r" e
      # morrer com "arquivo não encontrado" — apontando para um arquivo que
      # existe. O .gitattributes previne; isto CONFERE, porque prevenção sem
      # conferência é promessa.
      - name: Nenhum script com fim de linha do Windows
        run: |
          if git ls-files '*.sh' | xargs grep -lP '\r$' 2>/dev/null | grep .; then
            echo "Os arquivos acima têm CRLF — o bash não roda assim."
            exit 1
          fi
          echo "todos com LF"

      - name: Suíte do limitador de tentativas
        run: node testar-limitador.js

      # A gestão da academia (1.20.0): sobe o PRÓPRIO servidor, na 5311, com
      # banco temporário — contrato imutável, sequência de código, usuários,
      # matrícula pública. Não depende do servidor do passo seguinte.
      - name: Suíte da gestão da academia
        run: node testar-gestao.js

      # A suíte grande (254 checagens) fala com o site por HTTP e NÃO sobe o
      # servidor sozinha — ela espera encontrá-lo na porta 5186. Por isso ele é
      # levantado aqui.
      #
      # Morto pelo PID guardado, nunca por `pkill -f "node server.js"`: no
      # servidor de produção todos os sites rodam exatamente essa linha de
      # comando com o mesmo usuário, e um pkill assim derrubou a Imobiliária
      # inteira.
      - name: Suíte completa, com o servidor de pé
        env:
          PORT: 5186
          HOST: 127.0.0.1
        run: |
          node server.js & PID=$!
          for i in $(seq 1 20); do
            CODIGO=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:5186/" || echo 000)
            [ "$CODIGO" = "200" ] && break
            sleep 1
          done
          if [ "$CODIGO" != "200" ]; then
            kill "$PID" 2>/dev/null || true
            echo "o servidor não subiu (veio $CODIGO)"
            exit 1
          fi
          node testar.js
          RESULTADO=$?
          kill "$PID" 2>/dev/null || true
          exit $RESULTADO

  entregar:
    needs: provar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Preparar a chave e o host conhecido
        env:
          CHAVE: ${{ secrets.SSH_CHAVE_ENTREGA }}
          HOST_CONHECIDO: ${{ secrets.SSH_HOST_CONHECIDO }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$CHAVE" > ~/.ssh/id_entrega
          chmod 600 ~/.ssh/id_entrega
          # Host FIXADO, não aceito na hora: com StrictHostKeyChecking=no,
          # qualquer servidor que responda no meio do caminho receberia a
          # conexão — e a chave junto.
          printf '%s\n' "$HOST_CONHECIDO" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pedir a entrega
        env:
          DESTINO: ${{ secrets.SSH_DESTINO }}
        run: |
          set -o pipefail
          # Nenhum comando é enviado: o servidor ignora o que viesse aqui e roda
          # o `command=` preso à chave.
          ssh -T -i ~/.ssh/id_entrega \
              -o BatchMode=yes -o ConnectTimeout=20 \
              -o StrictHostKeyChecking=yes \
              "$DESTINO" 2>&1 | tee saida-da-entrega.txt

      - name: Guardar o log da entrega
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-da-entrega
          path: saida-da-entrega.txt
          retention-days: 30
          if-no-files-found: ignore
